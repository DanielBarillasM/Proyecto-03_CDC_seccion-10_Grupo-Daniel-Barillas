<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline futurista del compilador Compiscript</title>
  <desc id="desc">Código, lexer, parser, semántica, TAC y MIPS dentro del lenguaje visual de Compiscript Studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060811"/><stop offset=".55" stop-color="#0a1020"/><stop offset="1" stop-color="#07131b"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#8b7cff"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171d34" stop-opacity=".94"/><stop offset="1" stop-color="#0b1020" stop-opacity=".96"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#8ea0d3" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1500" height="430" rx="26" fill="url(#bg)"/><rect width="1500" height="430" rx="26" fill="url(#grid)"/>
  <circle cx="120" cy="55" r="150" fill="#8b7cff" opacity=".09" filter="url(#glow)"/><circle cx="1375" cy="375" r="170" fill="#25d9c7" opacity=".08" filter="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="50" fill="#edf0ff" font-size="21" font-weight="700">COMPISCRIPT STUDIO</text><text x="42" y="76" fill="#8e98b8" font-size="13" letter-spacing="2">PIPELINE DE COMPILACIÓN · PROYECTO 3</text><g transform="translate(1118 34)"><rect width="340" height="46" rx="23" fill="#10172a" stroke="#8ea0d3" stroke-opacity=".2"/><circle cx="27" cy="23" r="6" fill="#6ee7b7" filter="url(#glow)"/><text x="46" y="29" fill="#b9c2df" font-size="14">ANTLR → TAC → MIPS32 / MARS</text></g></g>
  <g stroke="#67e8f9" stroke-width="3" stroke-opacity=".72" fill="none" marker-end="url(#arrow)"><path d="M246 238h35"/><path d="M490 238h35"/><path d="M734 238h35"/><path d="M978 238h35"/><path d="M1222 238h35"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(38 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#8b7cff" stroke-opacity=".5"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#8b7cff" fill-opacity=".12"/><circle cx="22" cy="25" r="6" fill="#8b7cff"/><text x="39" y="31" fill="#d9d4ff" font-size="17" font-weight="700">01 · CÓDIGO</text><g font-family="Cascadia Code,Consolas,monospace" font-size="13"><text x="18" y="86" fill="#8e98b8">1</text><text x="42" y="86" fill="#c8c1ff">let</text><text x="68" y="86" fill="#edf0ff"> x = </text><text x="109" y="86" fill="#fdba74">6</text><text x="118" y="86" fill="#edf0ff">;</text><text x="18" y="116" fill="#8e98b8">2</text><text x="42" y="116" fill="#c8c1ff">let</text><text x="68" y="116" fill="#edf0ff"> y = </text><text x="109" y="116" fill="#fdba74">7</text><text x="118" y="116" fill="#edf0ff">;</text><text x="18" y="158" fill="#8e98b8">3</text><text x="42" y="158" fill="#c8c1ff">print</text><text x="82" y="158" fill="#edf0ff">(x * y);</text></g><rect x="18" y="196" width="172" height="30" rx="9" fill="#8b7cff" fill-opacity=".1"/><text x="30" y="216" fill="#a8b1d0" font-size="12">program.cps</text></g>
    <g transform="translate(282 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#9a8cff" stroke-opacity=".45"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#8b7cff" fill-opacity=".1"/><text x="20" y="31" fill="#d9d4ff" font-size="17" font-weight="700">02 · LEXER</text><g font-family="Cascadia Code,Consolas,monospace" font-size="12"><g fill="#151b31" stroke="#8b7cff" stroke-opacity=".5"><rect x="17" y="74" width="75" height="30" rx="8"/><rect x="104" y="74" width="86" height="30" rx="8"/><rect x="17" y="116" width="75" height="30" rx="8"/><rect x="104" y="116" width="86" height="30" rx="8"/><rect x="17" y="158" width="173" height="30" rx="8"/></g><text x="31" y="94" fill="#c8c1ff">LET</text><text x="118" y="94" fill="#67e8f9">ID(x)</text><text x="31" y="136" fill="#edf0ff">ASSIGN</text><text x="118" y="136" fill="#fdba74">INT(6)</text><text x="31" y="178" fill="#6ee7b7">21 tokens válidos</text></g><text x="17" y="218" fill="#8e98b8" font-size="12">ANTLR4TS generado</text></g>
    <g transform="translate(526 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#67e8f9" stroke-opacity=".42"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#67e8f9" fill-opacity=".08"/><text x="20" y="31" fill="#bff6ff" font-size="17" font-weight="700">03 · PARSER</text><g stroke="#67e8f9" stroke-opacity=".58" fill="#111a2c"><path d="M104 101 52 128M104 101l52 27M52 159l24 32M156 159l-24 32"/><rect x="68" y="70" width="72" height="31" rx="8"/><rect x="19" y="128" width="68" height="31" rx="8"/><rect x="121" y="128" width="68" height="31" rx="8"/><rect x="43" y="191" width="67" height="30" rx="8"/><rect x="99" y="191" width="67" height="30" rx="8"/></g><g fill="#d8f8ff" font-size="11" text-anchor="middle"><text x="104" y="90">Program</text><text x="53" y="148">VarDecl</text><text x="155" y="148">Call</text><text x="76" y="211">ID(x)</text><text x="132" y="211">Mul</text></g></g>
    <g transform="translate(770 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#57d8da" stroke-opacity=".42"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#57d8da" fill-opacity=".08"/><text x="20" y="31" fill="#bdf7ee" font-size="17" font-weight="700">04 · SEMÁNTICA</text><g fill="#111e2c" stroke="#6ee7b7" stroke-opacity=".55"><circle cx="104" cy="93" r="26"/><circle cx="52" cy="157" r="24"/><circle cx="156" cy="157" r="24"/></g><g stroke="#6ee7b7" stroke-opacity=".62"><path d="M87 113 65 138M121 113l22 25"/></g><g fill="#d6fff0" text-anchor="middle" font-size="11"><text x="104" y="97">global</text><text x="52" y="161">x:int</text><text x="156" y="161">y:int</text></g><rect x="20" y="199" width="168" height="30" rx="10" fill="#6ee7b7" fill-opacity=".11" stroke="#6ee7b7" stroke-opacity=".34"/><circle cx="37" cy="214" r="5" fill="#6ee7b7"/><text x="51" y="219" fill="#aef4d1" font-size="12">0 diagnósticos</text></g>
    <g transform="translate(1014 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#8b7cff" stroke-opacity=".48"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#8b7cff" fill-opacity=".1"/><text x="20" y="31" fill="#d9d4ff" font-size="17" font-weight="700">05 · TAC</text><g font-family="Cascadia Code,Consolas,monospace" font-size="12" fill="#cbd3ed"><text x="18" y="84">t0 = x * y</text><text x="18" y="112">param t0</text><text x="18" y="140">print t0</text></g><rect x="18" y="168" width="172" height="58" rx="11" fill="#8b7cff" fill-opacity=".08" stroke="#8b7cff" stroke-opacity=".3"/><text x="31" y="191" fill="#c8c1ff" font-size="12">frames · offsets</text><text x="31" y="211" fill="#8e98b8" font-size="12">temporales · CFG</text></g>
    <g transform="translate(1258 112)"><rect width="208" height="246" rx="18" fill="url(#panel)" stroke="#6ee7b7" stroke-opacity=".52"/><rect x="1" y="1" width="206" height="48" rx="17" fill="#6ee7b7" fill-opacity=".09"/><text x="20" y="31" fill="#caffdf" font-size="17" font-weight="700">06 · MIPS32</text><g font-family="Cascadia Code,Consolas,monospace" font-size="11.5" fill="#d7def4"><text x="18" y="82">lw   $t0, mem_x</text><text x="18" y="108">lw   $t1, mem_y</text><text x="18" y="134">mul  $a0,$t0,$t1</text><text x="18" y="160">li   $v0, 1</text><text x="18" y="186">syscall</text></g><rect x="18" y="202" width="172" height="30" rx="10" fill="url(#brand)" opacity=".92"/><text x="104" y="222" fill="#071019" font-size="12" font-weight="800" text-anchor="middle">MARS · SALIDA 42</text></g>
  </g>
  <rect x="1" y="1" width="1498" height="428" rx="25" fill="none" stroke="#8ea0d3" stroke-opacity=".18"/>
</svg>
